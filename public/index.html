<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETRO TERMINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:   #39ff14;
    --green2:  #b8ffb8;
    --dim:     #1a6b00;
    --dull:    #4a7a35;
    --bg:      #080e08;
    --bg2:     #0d160d;
    --border:  #1e3a1e;
    --amber:   #ffa500;
    --red:     #ff3030;
    --font:    'Share Tech Mono', 'Courier New', monospace;
  }

  html, body {
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
  }

  #app {
    width: min(820px, 100vw);
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  /* CRT scanline overlay */
  #app::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── Header ── */
  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #title {
    font-size: 13px;
    color: var(--green);
    letter-spacing: 4px;
  }
  #status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--dull);
  }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.8s infinite;
  }
  #status-dot.error { background: var(--red); animation: none; }

  /* ── Model bar ── */
  #model-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #model-bar label {
    font-size: 11px;
    color: var(--dull);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #model-select {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font);
    font-size: 12px;
    padding: 3px 8px;
    outline: none;
    cursor: pointer;
    flex: 1;
    max-width: 320px;
  }
  #model-select option { background: #0a0e0a; color: var(--green); }
  #refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dull);
    font-family: var(--font);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: color 0.15s, border-color 0.15s;
  }
  #refresh-btn:hover { color: var(--green); border-color: var(--green); }

  /* ── Screen ── */
  #screen {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  #screen::-webkit-scrollbar { width: 5px; }
  #screen::-webkit-scrollbar-thumb { background: var(--border); }

  .msg-row { display: flex; flex-direction: column; gap: 3px; }
  .msg-row.user  { align-items: flex-end; }
  .msg-row.bot   { align-items: flex-start; }
  .msg-row.sys   { align-items: center; }

  .msg-label {
    font-size: 10px;
    color: var(--dull);
    letter-spacing: 1.5px;
    padding: 0 4px;
  }

  .msg-bubble {
    max-width: 78%;
    padding: 8px 13px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 2px;
  }
  .msg-row.user .msg-bubble {
    background: #0d200d;
    border: 1px solid var(--green);
    color: var(--green);
    border-bottom-right-radius: 0;
  }
  .msg-row.bot .msg-bubble {
    background: #060c06;
    border: 1px solid var(--dim);
    color: var(--green2);
    border-bottom-left-radius: 0;
  }
  .msg-row.sys .msg-bubble {
    max-width: 100%;
    background: transparent;
    border: none;
    color: var(--amber);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 1px 0;
    text-align: center;
  }

  /* cursor blink inside streaming bubble */
  .cursor::after {
    content: '▌';
    animation: blink 0.8s infinite;
    color: var(--green);
  }

  /* ── Footer ── */
  #footer {
    border-top: 1px solid var(--border);
    background: var(--bg2);
    padding: 10px 16px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }
  #prompt-label {
    font-size: 14px;
    color: var(--green);
    flex-shrink: 0;
    padding-bottom: 2px;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font);
    font-size: 13px;
    color: var(--green);
    caret-color: var(--green);
    resize: none;
    min-height: 20px;
    max-height: 120px;
    line-height: 1.5;
  }
  #input::placeholder { color: var(--dim); }
  #send-btn {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 2px;
    padding: 5px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #send-btn:hover   { background: #0d2a0d; }
  #send-btn:active  { background: #1a3a1a; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Clear button ── */
  #clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dull);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 2px;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  #clear-btn:hover { color: var(--red); border-color: var(--red); }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="header">
    <span id="title">[ RETRO TERMINAL ]</span>
    <div id="status-row">
      <div id="status-dot"></div>
      <span id="status-text">BAĞLANIYOR...</span>
    </div>
  </div>

  <div id="model-bar">
    <label>MODEL //</label>
    <select id="model-select"><option>yükleniyor...</option></select>
    <button id="refresh-btn">YENİLE</button>
  </div>

  <div id="screen"></div>

  <div id="footer">
    <span id="prompt-label">&gt;_</span>
    <textarea id="input" rows="1" placeholder="mesajını yaz... (Enter = gönder, Shift+Enter = yeni satır)"></textarea>
    <button id="clear-btn">TEMİZLE</button>
    <button id="send-btn">GÖNDER</button>
  </div>

</div>

<script>
const screen     = document.getElementById('screen');
const input      = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const clearBtn   = document.getElementById('clear-btn');
const modelSel   = document.getElementById('model-select');
const refreshBtn = document.getElementById('refresh-btn');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let history = [];
let streaming = false;

// ── Helpers ──────────────────────────────────────────────

function sysMsg(text) {
  const row = document.createElement('div');
  row.className = 'msg-row sys';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  bub.textContent = text;
  row.appendChild(bub);
  screen.appendChild(row);
  scroll();
}

function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const lbl = document.createElement('span');
  lbl.className = 'msg-label';
  lbl.textContent = role === 'user' ? '// SEN' : '// MODEL';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  bub.textContent = text;
  row.appendChild(lbl);
  row.appendChild(bub);
  screen.appendChild(row);
  scroll();
  return bub;
}

function scroll() {
  screen.scrollTop = screen.scrollHeight;
}

function setStatus(ok, text) {
  statusDot.className = ok ? '' : 'error';
  statusText.textContent = text;
}

// ── Auto-resize textarea ──────────────────────────────────
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ── Load models ───────────────────────────────────────────
async function loadModels() {
  try {
    const res  = await fetch('/api/models');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    modelSel.innerHTML = data.models.map(m =>
      `<option value="${m}">${m}</option>`
    ).join('');
    setStatus(true, `ONLINE // ${data.models.length} MODEL`);
    sysMsg(`>> ${data.models.length} model yüklendi. Hazır.`);
  } catch (err) {
    setStatus(false, 'OLLAMA BULUNAMADI');
    sysMsg(`>> HATA: ${err.message}`);
    modelSel.innerHTML = '<option>-- model yok --</option>';
  }
}

refreshBtn.addEventListener('click', () => {
  sysMsg('>> Model listesi yenileniyor...');
  loadModels();
});

// ── Send message ──────────────────────────────────────────
async function send() {
  if (streaming) return;
  const text = input.value.trim();
  if (!text) return;

  const model = modelSel.value;
  if (!model || model === '-- model yok --' || model === 'yükleniyor...') {
    sysMsg('>> Önce bir model seç!');
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  streaming = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const botBub = addMsg('bot', '');
  botBub.classList.add('cursor');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: history }),
    });

    if (!res.ok) {
      const err = await res.json();
      botBub.classList.remove('cursor');
      botBub.textContent = `[HATA: ${err.error}]`;
      history.pop();
    } else {
      const reader = res.body.getReader();
      const dec    = new TextDecoder();
      let full = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = dec.decode(value, { stream: true });
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const json = JSON.parse(line.slice(6));
            if (json.token) {
              full += json.token;
              botBub.textContent = full;
              scroll();
            }
          } catch {}
        }
      }

      botBub.classList.remove('cursor');
      history.push({ role: 'assistant', content: full });
    }
  } catch (err) {
    botBub.classList.remove('cursor');
    botBub.textContent = `[BAĞLANTI HATASI: ${err.message}]`;
    history.pop();
  }

  streaming = false;
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

clearBtn.addEventListener('click', () => {
  history = [];
  screen.innerHTML = '';
  sysMsg('>> Sohbet temizlendi.');
});

// ── Init ──────────────────────────────────────────────────
sysMsg('>> SİSTEM BAŞLATILDI');
sysMsg('>> Ollama bağlantısı kontrol ediliyor...');
loadModels();
input.focus();
</script>
</body>
</html>
